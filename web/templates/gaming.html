
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第 {{ level }} 关 - 动作模仿挑战</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            color: #eee;
            overflow-x: hidden;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .nebula-1 { width: 350px; height: 350px; background: #667eea; top: -5%; left: 10%; }
        .nebula-2 { width: 300px; height: 300px; background: #f093fb; bottom: -5%; right: 8%; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            font-size: 2em;
            background: linear-gradient(45deg, #a78bfa, #f0abfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .level-badge {
            text-align: center;
            margin-bottom: 15px;
        }
        .level-badge span {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #a78bfa);
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .panel {
            flex: 1;
            min-width: 300px;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
        }

        .panel h3 {
            font-size: 1.2em;
            color: rgba(255,255,255,0.7);
            margin-bottom: 12px;
        }

        video, img {
            width: 100%;
            max-width: 460px;
            border-radius: 12px;
            background: #000;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        img {
            min-height: 280px;
            background: rgba(255,255,255,0.03);
            border-color: rgba(167, 139, 250, 0.4);
        }

        .status {
            text-align: center;
            margin: 12px 0;
            font-size: 1.05em;
            color: rgba(255,255,255,0.6);
            min-height: 24px;
        }

        .controls {
            text-align: center;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }

        .btn-capture {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: white;
        }
        .btn-back {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-save {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
        }
        .btn-next {
            background: linear-gradient(135deg, #667eea, #a78bfa);
            color: white;
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 1.5em; }
            .game-area { flex-direction: column; }
            .panel { min-width: 100%; }
            .controls { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 280px; }
        }
    </style>
</head>
<body>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>

    <div class="container">
        <h1>🎮 动作模仿挑战</h1>
        <div class="level-badge"><span>第 {{ level }} 关 / 共 {{ total_levels }} 关</span></div>
        <p class="status" id="statusText">正在加载关卡图片...</p>

        <div class="game-area">
            <div class="panel">
                <h3>📷 实时画面</h3>
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            <div class="panel">
                <h3>🎯 目标动作</h3>
                <img id="targetImage" src="" alt="加载中..." style="display:none;">
                <p id="imageHint" style="color: rgba(255,255,255,0.4); margin-top: 10px;">加载中...</p>
            </div>
        </div>

        <div class="controls">
            <button id="btnCapture" class="btn btn-capture" onclick="capturePhoto()" disabled>
                <span>📸</span> 拍照提交
            </button>
            <button class="btn btn-back" onclick="goBack()">
                <span>🗺️</span> 返回关卡
            </button>
            <button id="btnSave" class="btn btn-save" onclick="saveAndQuit()" style="display:none;">
                <span>💾</span> 通关！保存进度
            </button>
            {% if level < total_levels %}
            <button id="btnNext" class="btn btn-next" onclick="goNextLevel()" style="display:none;">
                <span>▶</span> 下一关
            </button>
            {% endif %}
        </div>
    </div>

    <script>
        const LEVEL = {{ level }};
        const TOTAL_LEVELS = {{ total_levels }};
        const SCORE_PER_LEVEL = 60;

        const video = document.getElementById('webcam');
        const targetImage = document.getElementById('targetImage');
        const imageHint = document.getElementById('imageHint');
        const statusText = document.getElementById('statusText');
        const btnCapture = document.getElementById('btnCapture');
        const btnSave = document.getElementById('btnSave');
        const btnNext = document.getElementById('btnNext');

        let stream = null;
        let photoLoaded = false;

        // 启动摄像头
        async function startCamera() {
            try {
                statusText.textContent = '📷 正在启动摄像头...';
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                video.srcObject = stream;
                statusText.textContent = '🎯 请模仿目标动作，完成后点击拍照提交';
            } catch (err) {
                statusText.textContent = '❌ 摄像头启动失败: ' + err.message;
                console.error(err);
            }
        }

        // 加载关卡图片
        async function loadLevelPhoto() {
            try {
                imageHint.textContent = '加载中...';
                const res = await fetch('/api/get_photo/' + LEVEL);
                const data = await res.json();
                if (data.status === 'success') {
                    targetImage.src = data.image_url;
                    targetImage.style.display = 'inline-block';
                    imageHint.style.display = 'none';
                    photoLoaded = true;
                    btnCapture.disabled = false;
                } else {
                    statusText.textContent = '❌ ' + (data.message || '图片加载失败');
                }
            } catch (e) {
                statusText.textContent = '❌ 网络错误，无法加载关卡图片';
                console.error(e);
            }
        }

        // 拍照提交
        function capturePhoto() {
            if (!stream || !video.videoWidth) return;
            if (!photoLoaded) return;

            btnCapture.disabled = true;
            statusText.textContent = '📸 正在拍照并上传...';

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('photo', blob, `capture_${LEVEL}_${Date.now()}.jpg`);

                try {
                    const res = await fetch('/api/save_gamer_photo', { method: 'POST', body: formData });
                    const result = await res.json();

                    if (result.status === 'success') {
                        // 自动保存进度（只有完成当前关卡才保存）
                        await fetch('/api/save_progress', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ level: LEVEL })
                        });

                        statusText.textContent = `✅ 第 ${LEVEL} 关完成！得分 +${SCORE_PER_LEVEL}，已自动保存进度`;
                        btnCapture.style.display = 'none';
                        btnSave.style.display = 'inline-flex';

                        {% if level < total_levels %}
                        btnNext.style.display = 'inline-flex';
                        {% endif %}
                    } else {
                        statusText.textContent = '❌ 上传失败: ' + result.message;
                        btnCapture.disabled = false;
                    }
                } catch (e) {
                    statusText.textContent = '❌ 上传异常: ' + e.message;
                    btnCapture.disabled = false;
                }
            }, 'image/jpeg', 0.85);
        }

        // 下一关
        function goNextLevel() {
            window.location.href = '/gaming/' + (LEVEL + 1);
        }

        // 通关保存进度
        function saveAndQuit() {
            window.location.href = '/choose';
        }

        // 返回关卡
        function goBack() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            window.location.href = '/choose';
        }

        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
        });

        // 启动
        startCamera().then(() => loadLevelPhoto());
    </script>
</body>
</html>

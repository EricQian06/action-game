<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动作模仿挑战</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 960px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 20px; }

        .game-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 20px 0; }
        .panel { flex: 1; min-width: 320px; text-align: center; }
        .panel h3 { margin-top: 0; color: #34495e; }

        img { width: 100%; max-width: 480px; border-radius: 8px; background: #000; object-fit: cover; }
        .preview-img { border: 3px solid #3498db; min-height: 300px; background: #ecf0f1; }
        .captured-img { border: 3px solid #27ae60; }

        .controls { text-align: center; margin-top: 20px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; margin: 5px; transition: 0.2s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #startBtn { background: #27ae60; color: white; }
        #captureBtn { background: #2980b9; color: white; display: none; }
        #nextBtn { background: #e67e22; color: white; display: none; }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }

        .status { text-align: center; margin: 15px 0; font-weight: 500; min-height: 24px; color: #555; }
        .hidden { display: none !important; }

        /* 评分显示样式 */
        .score-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 400px;
            text-align: center;
            display: none;
        }
        .score-panel.show { display: block; animation: fadeIn 0.5s ease; }
        .score-value {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .score-label {
            font-size: 18px;
            opacity: 0.9;
        }
        .score-bar {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }
        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
            transition: width 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 动作标签 */
        .action-tag {
            display: inline-block;
            padding: 5px 15px;
            background: #3498db;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            margin: 5px;
        }

        /* 等待提示 */
        .waiting-box {
            width: 100%;
            max-width: 480px;
            min-height: 300px;
            border: 3px dashed #bdc3c7;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ecf0f1;
            color: #7f8c8d;
        }
        .waiting-box .icon { font-size: 48px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 动作模仿挑战</h1>
        <p class="subtitle" id="statusText">点击"开始游戏"获取任务</p>

        <div class="game-area">
            <div class="panel">
                <h3>📷 你的动作</h3>
                <div id="waitingBox" class="waiting-box">
                    <div class="icon">📷</div>
                    <div>等待硬件拍照...</div>
                </div>
                <img id="capturedImage" src="" alt="拍摄结果" style="display:none;" class="captured-img">
            </div>
            <div class="panel">
                <h3>🎯 目标动作</h3>
                <img id="targetImage" src="" alt="等待加载..." style="display:none;" class="preview-img">
                <p id="imageHint" style="color:#888; margin-top:10px;">请先开始游戏</p>
            </div>
        </div>

        <!-- 评分显示面板 -->
        <div id="scorePanel" class="score-panel">
            <div class="score-label">动作匹配度</div>
            <div class="score-value" id="scoreValue">0%</div>
            <div class="score-bar">
                <div class="score-bar-fill" id="scoreBarFill" style="width: 0%"></div>
            </div>
            <div id="scoreMessage">正在评分...</div>
            <div id="targetActionDisplay" style="margin-top: 10px; font-size: 14px; opacity: 0.9;"></div>
        </div>

        <div class="controls">
            <button id="startBtn">开始游戏</button>
            <button id="captureBtn">📷 硬件拍照并评分</button>
            <button id="nextBtn">🔄 下一个动作</button>
        </div>
    </div>

    <script>
        const targetImage = document.getElementById('targetImage');
        const capturedImage = document.getElementById('capturedImage');
        const waitingBox = document.getElementById('waitingBox');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const nextBtn = document.getElementById('nextBtn');
        const statusText = document.getElementById('statusText');
        const imageHint = document.getElementById('imageHint');

        // 评分相关元素
        const scorePanel = document.getElementById('scorePanel');
        const scoreValue = document.getElementById('scoreValue');
        const scoreBarFill = document.getElementById('scoreBarFill');
        const scoreMessage = document.getElementById('scoreMessage');
        const targetActionDisplay = document.getElementById('targetActionDisplay');

        let currentTargetAction = 'squat';

        // 1. 开始游戏 - 获取首个任务
        startBtn.addEventListener('click', async () => {
            statusText.textContent = "正在分配动作任务...";
            startBtn.disabled = true;
            await loadNextAction();
        });

        // 2. 请求后端获取随机不重复图片
        async function loadNextAction() {
            try {
                captureBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                imageHint.style.display = 'block';
                imageHint.textContent = "加载中...";

                // 重置拍摄显示
                capturedImage.style.display = 'none';
                waitingBox.style.display = 'flex';

                const res = await fetch('/api/get_action_image');
                const data = await res.json();

                if (data.status === 'success') {
                    targetImage.src = data.image_url;
                    targetImage.style.display = 'inline-block';
                    imageHint.style.display = 'none';
                    statusText.textContent = "👉 请模仿屏幕中的动作，完成后点击拍照";
                    captureBtn.style.display = 'inline-block';
                    captureBtn.disabled = false;

                    // 保存当前目标动作
                    currentTargetAction = data.target_action || 'squat';
                    console.log('目标动作:', currentTargetAction);

                    // 隐藏评分面板
                    scorePanel.classList.remove('show');
                } else {
                    statusText.textContent = "⚠️ " + (data.message || "所有动作已轮询完毕，请刷新页面重新开始");
                    captureBtn.style.display = 'none';
                }
            } catch (err) {
                statusText.textContent = "❌ 网络请求失败: " + err.message;
            }
        }

        // 3. 硬件拍照并评分
        captureBtn.addEventListener('click', async () => {
            captureBtn.disabled = true;
            statusText.textContent = "📷 正在通过硬件摄像头拍照...";

            try {
                // 调用拍照+评分接口
                const res = await fetch('/api/capture_and_score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target_action: currentTargetAction
                    })
                });

                const result = await res.json();

                if (result.status === 'success') {
                    // 显示拍摄的照片
                    waitingBox.style.display = 'none';
                    capturedImage.src = result.image_path + '?t=' + Date.now();
                    capturedImage.style.display = 'inline-block';

                    // 显示评分
                    displayScore(result);

                    statusText.textContent = `✅ 评分完成！相似度: ${(result.score * 100).toFixed(1)}%`;
                    captureBtn.style.display = 'none';
                    nextBtn.style.display = 'inline-block';
                } else {
                    statusText.textContent = "❌ " + result.message;
                    captureBtn.disabled = false;
                }
            } catch (err) {
                console.error('请求失败:', err);
                statusText.textContent = "❌ 请求失败: " + err.message;
                captureBtn.disabled = false;
            }
        });

        // 4. 切换到下一个动作
        nextBtn.addEventListener('click', () => {
            scorePanel.classList.remove('show');
            capturedImage.style.display = 'none';
            waitingBox.style.display = 'flex';
            loadNextAction();
        });

        // 显示评分结果
        function displayScore(result) {
            const score = result.score;
            const percentage = Math.round(score * 100);
            const matchLevel = result.match_level;
            const matchText = result.match_text;

            scoreValue.textContent = percentage + '%';
            scoreBarFill.style.width = percentage + '%';

            scorePanel.className = 'score-panel show';
            if (matchLevel === 'high') {
                scorePanel.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
                scoreMessage.innerHTML = `<span style="font-size: 24px;">🎉</span> ${matchText}！动作非常标准！`;
            } else if (matchLevel === 'medium') {
                scorePanel.style.background = 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
                scoreMessage.innerHTML = `<span style="font-size: 24px;">👍</span> ${matchText}，动作基本完成`;
            } else {
                scorePanel.style.background = 'linear-gradient(135deg, #ff9966 0%, #ff5e62 100%)';
                scoreMessage.innerHTML = `<span style="font-size: 24px;">💪</span> ${matchText}，再试一次会更好`;
            }

            const actionNames = {
                'squat': '深蹲',
                'standing': '站立',
                'hands_up': '举手',
                'stride': '跨步',
                'jump': '跳跃',
                'sit': '坐下'
            };
            const actionName = actionNames[result.target_action] || result.target_action;
            targetActionDisplay.innerHTML = `目标动作: <span class="action-tag">${actionName}</span>`;
        }
    </script>
</body>
</html>

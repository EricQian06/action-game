<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动作模仿挑战 - 闯关模式</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        
        body { 
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333; 
            overflow-x: hidden;
        }
        
        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255,255,255,0.05) 0%, transparent 20%);
            z-index: -1;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: -1;
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            margin-bottom: 10px; 
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: #7f8c8d; 
            margin-bottom: 20px; 
            font-size: 1.1em;
        }

        /* ===== 关卡地图 ===== */
        .level-map {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
            padding: 18px 12px;
            background: linear-gradient(to right, #f0f0f5, #e8ecf1);
            border-radius: 14px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            overflow-x: auto;
        }

        .level-box {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            color: #555;
            background: #e0e0e0;
            border: 2px solid #ccc;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .level-box.current {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
            border-color: #667eea;
            box-shadow: 0 0 14px rgba(102, 126, 234, 0.5);
            transform: scale(1.15);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .level-box.completed {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: #fff;
            border-color: #27ae60;
        }

        .level-arrow {
            font-size: 18px;
            color: #999;
            flex-shrink: 0;
            user-select: none;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 14px rgba(102, 126, 234, 0.5); }
            50% { box-shadow: 0 0 24px rgba(102, 126, 234, 0.8); }
        }

        /* ===== 游戏信息栏 ===== */
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }
        
        .level-indicator {
            font-weight: bold;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .score-display {
            font-weight: bold;
            color: #28a745;
            font-size: 1.2em;
        }
        
        .game-area { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            margin: 20px 0; 
        }
        
        .panel { 
            flex: 1; 
            min-width: 320px; 
            text-align: center; 
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        
        .panel:hover {
            transform: translateY(-5px);
        }
        
        .panel h3 { 
            margin-top: 0; 
            color: #34495e; 
            font-size: 1.3em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .panel-icon {
            font-size: 1.2em;
        }
        
        video, img { 
            width: 100%; 
            max-width: 480px; 
            border-radius: 12px; 
            background: #000; 
            object-fit: cover; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 3px solid #e9ecef;
        }
        
        img { 
            border: 3px solid #667eea; 
            min-height: 300px; 
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
        }
        
        .controls { 
            text-align: center; 
            margin-top: 20px; 
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .custom-button {
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            margin: 5px;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 150px;
        }
        
        .custom-button:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
            transform: none !important;
        }
        
        .custom-button:hover:not(:disabled) { 
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        .custom-button:active:not(:disabled) {
            transform: translateY(1px);
        }
        
        #startBtn { 
            background: linear-gradient(45deg, #27ae60, #2ecc71); 
            color: white; 
        }
        
        #captureBtn { 
            background: linear-gradient(45deg, #2980b9, #3498db); 
            color: white; 
            display: none; 
        }
        
        #nextBtn { 
            background: linear-gradient(45deg, #e67e22, #f39c12); 
            color: white; 
            display: none; 
        }
        
        #exitBtn { 
            background: linear-gradient(45deg, #e74c3c, #c0392b); 
            color: white; 
            display: none; 
        }
        
        .status { 
            text-align: center; 
            margin: 15px 0; 
            font-weight: 500; 
            min-height: 24px; 
            color: #555; 
            font-size: 1.1em;
            padding: 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.02);
        }
        
        .hidden { 
            display: none !important; 
        }
        
        .progress-container {
            width: 100%;
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .action-counter {
            text-align: center;
            font-size: 1.1em;
            color: #667eea;
            font-weight: bold;
            margin: 10px 0;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .game-area {
                flex-direction: column;
            }
            
            .panel {
                min-width: 100%;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .custom-button {
                width: 100%;
                max-width: 300px;
            }

            .level-box {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .level-arrow {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    <div class="container">
        <h1>🎮 动作模仿挑战 - 闯关模式</h1>
        <p class="subtitle" id="statusText">点击"开始游戏"启动摄像头并获取第一个动作任务</p>

        <!-- ===== 关卡地图 ===== -->
        <div class="level-map" id="levelMap">
            <!-- 动态生成 -->
        </div>
        
        <div class="game-info">
            <div class="level-indicator">关卡: <span id="currentLevel">1</span>/<span id="totalLevels">-</span></div>
            <div class="score-display">得分: <span id="currentScore">0</span></div>
        </div>
        
        <div class="action-counter">
            已完成: <span id="completedCount">0</span>/<span id="totalCount">-</span> 个动作
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="game-area">
            <div class="panel">
                <h3><span class="panel-icon">📷</span> 实时画面</h3>
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            <div class="panel">
                <h3><span class="panel-icon">🎯</span> 目标动作</h3>
                <img id="targetImage" src="" alt="等待加载目标动作..." style="display:none;">
                <p id="imageHint" style="color:#888; margin-top:10px;">请先开始游戏</p>
            </div>
        </div>
        
        <div class="controls">
            <button id="startBtn" class="custom-button">
                <span>🎮</span> 开始游戏
            </button>
            <button id="captureBtn" class="custom-button">
                <span>📸</span> 拍照提交
            </button>
            <button id="nextBtn" class="custom-button">
                <span>➡️</span> 下一关
            </button>
            <button id="exitBtn" class="custom-button">
                <span>🚪</span> 退出游戏
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const targetImage = document.getElementById('targetImage');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');
        const statusText = document.getElementById('statusText');
        const imageHint = document.getElementById('imageHint');
        const currentLevel = document.getElementById('currentLevel');
        const currentScore = document.getElementById('currentScore');
        const completedCount = document.getElementById('completedCount');
        const totalCount = document.getElementById('totalCount');
        const progressBar = document.getElementById('progressBar');
        const levelMap = document.getElementById('levelMap');
        const totalLevels = document.getElementById('totalLevels');
        
        let stream = null;
        let level = 1;
        let score = 0;
        let completedActions = 0;
        let totalActions = 0;  // 由后端照片数量决定

        // 常量：每关固定得分
        const SCORE_PER_LEVEL = 60;

        // ===== 加载照片数量 =====
        async function fetchPhotoCount() {
            try {
                const res = await fetch('/api/photo_count');
                const data = await res.json();
                if (data.status === 'success') {
                    totalActions = data.count;
                } else {
                    totalActions = 0;
                }
            } catch (e) {
                console.error('获取照片数量失败:', e);
                totalActions = 0;
            }
            // 更新 UI
            totalCount.textContent = totalActions;
            totalLevels.textContent = totalActions;
            renderLevelMap();
        }

        // ===== 渲染关卡地图（方框 + 箭头） =====
        function renderLevelMap() {
            levelMap.innerHTML = '';
            if (totalActions === 0) {
                levelMap.innerHTML = '<span style="color:#999">暂无关卡数据</span>';
                return;
            }
            for (let i = 1; i <= totalActions; i++) {
                // 关卡方框
                const box = document.createElement('div');
                box.className = 'level-box';
                box.textContent = i;
                box.dataset.level = i;
                if (i < level) {
                    box.classList.add('completed');
                } else if (i === level) {
                    box.classList.add('current');
                }
                levelMap.appendChild(box);

                // 箭头（最后一个后面不加）
                if (i < totalActions) {
                    const arrow = document.createElement('span');
                    arrow.className = 'level-arrow';
                    arrow.textContent = '→';
                    levelMap.appendChild(arrow);
                }
            }
        }

        // 更新进度条
        function updateProgress() {
            if (totalActions === 0) return;
            const progressPercent = (completedActions / totalActions) * 100;
            progressBar.style.width = `${progressPercent}%`;
            completedCount.textContent = completedActions;
        }
        
        // 更新关卡和分数
        function updateGameInfo() {
            currentLevel.textContent = level;
            currentScore.textContent = score;
            renderLevelMap();
        }
        
        // 1. 启动摄像头 & 获取首个任务
        startBtn.addEventListener('click', async () => {
            try {
                statusText.textContent = "🎮 正在申请摄像头权限...";
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                video.srcObject = stream;
                statusText.textContent = "🎥 摄像头已就绪，正在分配第一个动作任务...";
                startBtn.style.display = 'none';
                await loadNextAction();
            } catch (err) {
                statusText.textContent = "❌ 摄像头启动失败: " + err.message;
                console.error(err);
            }
        });
 
        // 2. 请求后端获取随机不重复图片
        async function loadNextAction() {
            try {
                captureBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                exitBtn.style.display = 'none';
                imageHint.style.display = 'block';
                imageHint.textContent = "🔄 加载中...";
                
                const res = await fetch('/api/get_action_image');
                const data = await res.json();
                
                if (data.status === 'success') {
                    targetImage.src = data.image_url;
                    targetImage.style.display = 'inline-block';
                    imageHint.style.display = 'none';
                    statusText.textContent = `👉 第 ${level} 关：请模仿屏幕中的动作，完成后点击"拍照提交"`;
                    captureBtn.style.display = 'inline-block';
                    captureBtn.disabled = false;
                } else {
                    statusText.textContent = "⚠️ " + (data.message || "所有动作已轮询完毕，请刷新页面重新开始");
                    captureBtn.style.display = 'none';
                }
            } catch (err) {
                statusText.textContent = "❌ 网络请求失败: " + err.message;
            }
        }
 
        // 3. 拍照并上传
        captureBtn.addEventListener('click', async () => {
            if (!stream || !video.videoWidth) return;
            
            captureBtn.disabled = true;
            statusText.textContent = "📸 正在拍照并上传...";
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('photo', blob, `capture_${Date.now()}.jpg`);
                
                try {
                    const res = await fetch('/api/save_gamer_photo', { method: 'POST', body: formData });
                    const result = await res.json();
                    
                    if (result.status === 'success') {
                        // 每关固定得 60 分
                        score += SCORE_PER_LEVEL;
                        completedActions++;
                        
                        updateGameInfo();
                        updateProgress();
                        
                        statusText.textContent = `✅ 第 ${level} 关完成！得分：${score}，请选择下一步操作`;
                        captureBtn.style.display = 'none';
                        
                        if (level < totalActions) {
                            nextBtn.style.display = 'inline-block';
                        } else {
                            statusText.textContent = `🎉 恭喜通关！总得分：${score}，请选择下一步操作`;
                        }
                        exitBtn.style.display = 'inline-block';
                    } else {
                        statusText.textContent = "❌ 上传失败: " + result.message;
                        captureBtn.disabled = false;
                    }
                } catch (err) {
                    statusText.textContent = "❌ 上传异常: " + err.message;
                    captureBtn.disabled = false;
                }
            }, 'image/jpeg', 0.85);
        });
 
        // 4. 下一关
        nextBtn.addEventListener('click', () => {
            level++;
            updateGameInfo();
            loadNextAction();
        });
 
        // 5. 退出游戏
        exitBtn.addEventListener('click', () => {
            if (confirm('确定要退出游戏吗？您的进度将会保存。')) {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                window.location.href = '/';
            }
        });
 
        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
        });

        // 页面加载时获取照片数量
        fetchPhotoCount();
    </script>
</body>
</html>

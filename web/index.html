<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深蹲闯关游戏 - Squat Challenge</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- 加载画面 -->
        <div id="loading-screen" class="screen active">
            <div class="loading-content">
                <div class="logo">
                    <h1>SQUAT CHALLENGE</h1>
                    <span class="subtitle">深蹲闯关</span>
                </div>
                <div class="loading-bar">
                    <div class="progress"></div>
                </div>
                <p class="loading-text">正在加载资源...</p>
            </div>
        </div>

        <!-- 主页面 - 开始按钮 -->
        <div id="start-screen" class="screen">
            <div class="start-container">
                <div class="start-box">
                    <h1>深蹲闯关</h1>
                    <p class="challenge-description">
                        完成 <span class="highlight">5</span> 个深蹲即可闯关成功！
                    </p>
                    <div class="rules">
                        <h3>游戏规则</h3>
                        <ul>
                            <li>点击下方"开始挑战"按钮</li>
                            <li>允许浏览器访问摄像头</li>
                            <li>面对摄像头，保持全身在画面内</li>
                            <li>完成标准的深蹲动作</li>
                            <li>计数达到5次即闯关成功</li>
                        </ul>
                    </div>
                    <button id="btn-start-challenge" class="btn btn-primary btn-large">
                        <i class="icon-play"></i>
                        <span>开始挑战</span>
                    </button>
                    <div class="system-status-mini">
                        <span class="status-dot" id="detector-status-dot"></span>
                        <span id="detector-status-text">检测器初始化中...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 深蹲挑战页面 -->
        <div id="squat-screen" class="screen">
            <div class="squat-container">
                <!-- 顶部信息栏 -->
                <header class="squat-header">
                    <div class="squat-title">
                        <h2>深蹲挑战</h2>
                        <span class="challenge-hint">目标: 5个深蹲</span>
                    </div>
                    <div class="squat-counter">
                        <span class="counter-label">当前计数</span>
                        <span class="counter-value">
                            <span id="current-count">0</span>
                            <span class="counter-separator">/</span>
                            <span class="counter-target">5</span>
                        </span>
                    </div>
                </header>

                <!-- 主画面区域 -->
                <main class="squat-main">
                    <!-- 视频画面 -->
                    <div class="video-panel">
                        <div class="video-container">
                            <!-- 本地摄像头预览 -->
                            <video id="local-video" autoplay playsinline muted></video>
                            <!-- 服务器返回的处理后画面 -->
                            <img id="processed-frame" alt="Processed Frame">
                            <!-- 启动摄像头按钮（初始显示） -->
                            <div class="camera-placeholder" id="camera-placeholder">
                                <div class="placeholder-icon">📷</div>
                                <p>等待摄像头启动...</p>
                                <button id="btn-enable-camera" class="btn btn-primary">
                                    启用摄像头
                                </button>
                            </div>
                        </div>

                        <!-- 进度条 -->
                        <div class="progress-container">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" id="squat-progress-bar" style="width: 0%"></div>
                            </div>
                            <span class="progress-text" id="squat-progress-text">0%</span>
                        </div>

                        <!-- 状态信息 -->
                        <div class="squat-status" id="squat-status">
                            <span class="status-icon">⏳</span>
                            <span class="status-text">请站好准备开始...</span>
                        </div>
                    </div>
                </main>

                <!-- 底部控制栏 -->
                <footer class="squat-footer">
                    <button id="btn-stop-squat" class="btn btn-secondary">
                        <i class="icon-stop"></i>
                        <span>停止挑战</span>
                    </button>
                </footer>
            </div>
        </div>

        <!-- 成功页面 -->
        <div id="success-screen" class="screen">
            <div class="success-container">
                <div class="success-box">
                    <div class="success-icon">🏆</div>
                    <h1>闯关成功！</h1>
                    <p class="success-message">恭喜你完成了5个深蹲！</p>
                    <div class="success-stats">
                        <div class="stat-item">
                            <span class="stat-label">完成深蹲</span>
                            <span class="stat-value" id="final-squat-count">5</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">挑战结果</span>
                            <span class="stat-value success-text">通过</span>
                        </div>
                    </div>
                    <button id="btn-confirm-success" class="btn btn-primary btn-large">
                        <span>确认</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本引用 -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
